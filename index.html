  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Universitas Pasundan",
      "description": "Universitas Pasundan (Unpas) adalah kampus unggulan di Bandung",
      "url": "https://pmb.unpas.ac.id",
      "image": "https://pmb.unpas.ac.id/assets/gedung2-CVfjYJ9L.jpg"
    }
    </script>

  <script>
    (function () {
      var path = window.location.pathname;
      var isArticle = path.includes('/artikel/');
      var currentUrl = window.location.href;

      document.getElementById('og-url').content = currentUrl;

      if (isArticle) {
        var slug = path.split('/artikel/')[1];
        var defaultTitle = "Artikel Universitas Pasundan - " + decodeURIComponent(slug.replace(/-/g, ' '));
        var defaultDesc = "Baca artikel menarik dari Universitas Pasundan";
        var defaultImage = "https://pmb.unpas.ac.id/assets/gedung2-CVfjYJ9L.jpg";

        document.write(
          '<meta property="og:title" content="' + defaultTitle + '" />' +
          '<meta property="og:description" content="' + defaultDesc + '" />' +
          '<meta property="og:image" content="' + defaultImage + '" />' +
          '<meta name="twitter:title" content="' + defaultTitle + '" />' +
          '<meta name="twitter:description" content="' + defaultDesc + '" />' +
          '<meta name="twitter:image" content="' + defaultImage + '" />'
        );

        window.addEventListener('DOMContentLoaded', function () {
          fetch('https://cms.unpas.ac.id/api/post/' + slug)
            .then(function (response) {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.json();
            })
            .then(function (data) {
              var title = data.title || defaultTitle;
              var desc = data.content ? data.content.substring(0, 150) + '...' : defaultDesc;
              var image = data.image ? 'https://cms.unpas.ac.id/storage/posts/' + data.image : defaultImage;

              var metaTags = [
                { property: 'og:title', content: title + ' - Universitas Pasundan' },
                { property: 'og:description', content: desc },
                { property: 'og:image', content: image },
                { name: 'twitter:title', content: title + ' - Universitas Pasundan' },
                { name: 'twitter:description', content: desc },
                { name: 'twitter:image', content: image }
              ];

              metaTags.forEach(function (tag) {
                var el = document.querySelector(
                  tag.property ?
                    'meta[property="' + tag.property + '"]' :
                    'meta[name="' + tag.name + '"]'
                );
                if (el) el.content = tag.content;
              });

              document.title = title + ' - Universitas Pasundan';
            })
            .catch(function (error) {
              console.error('Error fetching article meta:', error);
            });
        });
      }
    })();

    (function (h, o, t, j, a, r) {
